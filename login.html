<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorem Ipsum</title>
</head>

<body class="bg-gray-100">
    <div class="justify-end flex">
        <img src="img/info_151776.png" class="size-[20px] mt-2 justify-end cursor-pointer" onclick="sobre()">
    </div>
    <div class="justify-center align-middle flex flex-col items-center m-auto">
        <img src="img/lorem_logo.png">
        <h1 class="text-[40px] font-serif text-gray-500">Seja bem-vindo!</h1>

        <div id="popup" class="fixed mt-40 justify-center align-middle items-center m-auto">
            <div
                class="h-[250px] w-[500px] items-center align-middle justify-center flex bg-white border-1 border-black flex-col">
                <div class="flex justify-end w-full mr-5">
                    <p id="closepopup" class="border-b-1 text-gray-500 cursor-pointer">Fechar</p>
                </div>
                <img src="img/lorem_logo.png" class="size-[100px] ">
                <h1 id="textpopup" class="font-serif text-center mb-15 text-[30px]">As senhas nao coincidem!</h1>
            </div>
        </div>


        

        <div class="box w-[400px] h-[90px] border-1 mt-1 border-gray-400 flex flex-col mt-5 rounded-xl">
            <label class="mt-2 ml-2 text-[20px] font-serif text-gray-600 ">Email</label>
            <input type="email" id="email" placeholder="email@example" class="ml-2 mt-1">
        </div>
        <div class="box w-[400px] h-[90px] border-1 mt-1 border-gray-400 flex flex-col mt-5 rounded-xl">
            <label class="mt-2 ml-2 text-[20px] font-serif text-gray-600 ">Senha</label>
            <input type="password" id="senha" placeholder="" class="ml-2 mt-1">
        </div>
        <button id="btn_login"
            class="mt-4 h-[40px] w-[340px] rounded-xl text-white font-serif hover:bg-blue-800 cursor-pointer bg-[#2e537d]">Entrar</button>

        <a href="recuperar_senha.html" class="mt-2 text-blue-400 font-serif">Esqueci minha senha</a>
    </div>

    <script src="js/login.js"></script>

</body>

</html>
